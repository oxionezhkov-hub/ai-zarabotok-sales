name: "Threads — продление токена"

on:
  schedule:
    - cron: "17 6 * * 1"   # каждый понедельник
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Продлить токен и сохранить в секрет
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python3 threads/scripts/refresh_token.py)
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Нет секрета GH_PAT, новый токен не сохранён. Обновите THREADS_TOKEN вручную раз в 60 дней."
            exit 0
          fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
