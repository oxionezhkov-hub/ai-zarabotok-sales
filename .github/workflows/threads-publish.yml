name: "Threads — публикация по расписанию"

on:
  schedule:
    - cron: "3,33 * * * *"   # каждые 30 минут, посты стоят на :00 и :30 по Москве
  workflow_dispatch:

concurrency:
  group: threads-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Опубликовать посты, у которых подошло время
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 threads/scripts/publish.py
      - name: Сохранить статусы постов
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add threads/queue
          git diff --cached --quiet || (git commit -m "Threads: обновить статусы постов" && git push)
